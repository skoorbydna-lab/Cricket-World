<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cricket</title>
<style>
html,body{margin:0;height:100%;background:#050912;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8f0ff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none}
.tabs{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:rgba(8,14,28,.82);padding:4px;border-radius:14px;pointer-events:auto;border:1px solid rgba(120,160,255,.18);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tabs button{appearance:none;border:0;background:transparent;color:#9fb2d8;font:600 13px system-ui;padding:8px 12px;border-radius:10px;cursor:pointer;letter-spacing:.3px}
.tabs button.on{background:linear-gradient(180deg,#22e07a,#12a65a);color:#04140b;box-shadow:0 0 14px rgba(34,224,122,.45)}
#bug{position:absolute;top:62px;left:10px;display:flex;align-items:stretch;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.45);font-weight:700}
#bug .tm{background:#12a65a;color:#04140b;padding:6px 9px;font-size:12px;display:flex;align-items:center;letter-spacing:.5px}
#bug .sc{background:rgba(8,14,28,.9);padding:5px 10px;font-size:18px;font-variant-numeric:tabular-nums}
#bug .ov{background:rgba(20,30,55,.92);padding:6px 9px;font-size:12px;color:#9fb2d8;display:flex;align-items:center;font-variant-numeric:tabular-nums}
#over{position:absolute;top:100px;left:10px;display:flex;gap:4px}
#over span{min-width:22px;height:22px;border-radius:11px;background:rgba(8,14,28,.85);border:1px solid rgba(120,160,255,.25);font:700 11px system-ui;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box}
#over span.b4{background:#2b6cff;border-color:#2b6cff}
#over span.b6{background:#a64dff;border-color:#a64dff}
#over span.bw{background:#ff3b5c;border-color:#ff3b5c}
#over span.bx{background:#d9a400;border-color:#d9a400;color:#1a1200}
#tick{position:absolute;left:10px;right:10px;bottom:12px;background:rgba(8,14,28,.86);border:1px solid rgba(120,160,255,.18);border-left:4px solid #22e07a;border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.3;min-height:20px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#tick b{color:#22e07a}
#hint{position:absolute;left:10px;right:10px;bottom:64px;text-align:center;font-size:12px;color:#c6d4f2;text-shadow:0 1px 3px #000;opacity:.9}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;font:900 54px system-ui;letter-spacing:2px;color:#fff;text-shadow:0 0 24px rgba(34,224,122,.8),0 3px 0 #000;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1)}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font:600 15px system-ui;letter-spacing:.5px;color:#c6d4f2;text-shadow:0 1px 3px #000;margin-top:4px}
#banner.out{text-shadow:0 0 24px rgba(255,59,92,.9),0 3px 0 #000}
#banner.six{text-shadow:0 0 24px rgba(166,77,255,.9),0 3px 0 #000}
#banner.four{text-shadow:0 0 24px rgba(43,108,255,.9),0 3px 0 #000}
#timing{position:absolute;left:0;right:0;top:calc(36% + 86px);text-align:center;font:700 14px system-ui;color:#ffd84d;text-shadow:0 1px 3px #000}
#coach{position:absolute;top:128px;left:10px;right:10px;background:rgba(8,14,28,.9);border:1px solid rgba(255,216,77,.35);border-left:4px solid #ffd84d;border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.3;display:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#coach .ch{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#ffd84d;font-size:14px;margin-bottom:3px}
#coD{letter-spacing:3px;font-size:13px}
#coF{margin-top:5px;font-weight:600;min-height:17px}
#coF.ok{color:#22e07a}#coF.bad{color:#ff8a9c}
#coPick{display:flex;gap:6px;margin-top:8px}#coPick button,#coBack{pointer-events:auto;appearance:none;flex:1;border:1px solid rgba(255,216,77,.5);background:rgba(255,216,77,.12);color:#ffd84d;font:800 13px system-ui;padding:9px 4px;border-radius:9px;cursor:pointer}
#coBack{flex:none;margin-top:6px;padding:4px 8px;font:600 11px system-ui;background:transparent;border:0;color:#9fb2d8}
#risk{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);pointer-events:auto;display:none;appearance:none;border:0;border-radius:14px;padding:12px 20px;font:900 16px system-ui;letter-spacing:.5px;color:#1a1200;background:linear-gradient(180deg,#ffd84d,#e0a800);box-shadow:0 0 22px rgba(255,216,77,.6),0 6px 16px rgba(0,0,0,.5);animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.07)}}
#gun{position:absolute;top:128px;left:10px;background:rgba(8,14,28,.9);border:1px solid rgba(255,216,77,.5);border-radius:10px;padding:4px 10px 6px;display:none;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#gun small{display:block;font:700 9px system-ui;letter-spacing:1.5px;color:#ffd84d}
#gunV{font:900 22px system-ui;font-variant-numeric:tabular-nums}
#chips{position:absolute;left:8px;right:8px;bottom:104px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#chips button{pointer-events:auto;appearance:none;border:1px solid rgba(120,160,255,.3);background:rgba(8,14,28,.85);color:#e8f0ff;font:600 11px system-ui;padding:5px 10px;border-radius:14px;cursor:pointer}
#chips button.info{pointer-events:none;color:#9fb2d8}
#hint,#chips{display:none!important}
#pauseBtn{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;border:1px solid rgba(120,160,255,.3);background:rgba(8,14,28,.85);color:#e8f0ff;font:900 15px system-ui;pointer-events:auto;cursor:pointer;z-index:5}
#press{position:absolute;left:10px;bottom:62px;width:170px;display:none;align-items:center;gap:7px;font:700 10px system-ui;letter-spacing:.8px;color:#c6d4f2;text-transform:uppercase}
#press .bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}#pressF{height:100%;width:0;transition:width .4s,background .4s}
#overCard{position:absolute;left:50%;top:30%;transform:translate(-50%,-10px);opacity:0;background:rgba(8,14,28,.92);border:1px solid rgba(34,224,122,.5);border-radius:14px;padding:12px 22px;text-align:center;transition:opacity .3s,transform .3s;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#overCard.show{opacity:1;transform:translate(-50%,0)}
#overCard small{display:block;font:800 11px system-ui;letter-spacing:2px;color:#22e07a}#overCard b{display:block;font:900 22px system-ui;margin:3px 0}#overCard span{font:600 13px system-ui;color:#9fb2d8}
#minfo{position:absolute;top:48px;left:10px;right:60px;display:none;font:600 12px system-ui;line-height:1.45;text-shadow:0 1px 3px #000}
#minfo .t{color:#ffd84d;font-weight:800}#minfo .bt{color:#e8f0ff}#minfo .bw{color:#9fb2d8}
.tabs{display:none!important}body.practice .tabs{display:flex!important}body.inmatch .tabs{display:none!important}body.inmatch #bug{top:10px}body.inmatch #minfo{display:block}body.inmatch #over{top:102px}body.inmatch #gun{top:130px}
#bug .tm{min-width:34px;justify-content:center}
/* ---------- menus ---------- */
#screen{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#071022,#0b1630);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;touch-action:pan-y;padding-bottom:40px}
#screen.on{display:block}
.scr{max-width:560px;margin:0 auto;padding:14px 14px 30px}
.scr h1{font:900 30px system-ui;margin:18px 0 4px;letter-spacing:1px}.scr h1 em{color:#22e07a;font-style:normal}
.scr h2{font:800 18px system-ui;margin:16px 0 8px}.scr h3{font:800 13px system-ui;margin:14px 0 6px;color:#9fb2d8;letter-spacing:1px;text-transform:uppercase}
.sub{color:#9fb2d8;font-size:13px;margin:0 0 12px}
.btn{display:block;width:100%;box-sizing:border-box;appearance:none;border:1px solid rgba(120,160,255,.25);background:rgba(20,30,55,.9);color:#e8f0ff;font:700 15px system-ui;padding:13px 14px;border-radius:12px;margin:7px 0;text-align:left;cursor:pointer}
.btn.pri{background:linear-gradient(180deg,#22e07a,#12a65a);color:#04140b;border:0;text-align:center;font-weight:900}
.btn.sm{display:inline-block;width:auto;padding:7px 11px;font-size:12px;margin:3px 3px 3px 0}
.btn small{display:block;font-weight:500;color:#9fb2d8;font-size:12px;margin-top:2px}.btn.pri small{color:#063}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.team{padding:12px 8px;border-radius:12px;border:2px solid transparent;cursor:pointer;text-align:center;font:800 14px system-ui;color:#fff}
.team small{display:block;font:600 11px system-ui;opacity:.85;margin-top:3px}
.card{background:rgba(8,14,28,.75);border:1px solid rgba(120,160,255,.18);border-radius:12px;padding:10px 12px;margin:8px 0}
table.t{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.t th{text-align:right;color:#9fb2d8;font-weight:700;padding:5px 4px;border-bottom:1px solid rgba(120,160,255,.2);white-space:nowrap}
table.t td{text-align:right;padding:6px 4px;border-bottom:1px solid rgba(120,160,255,.08);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;white-space:normal}
table.t tr.me td{color:#22e07a;font-weight:800}table.t tr.click{cursor:pointer}
.tw{overflow-x:auto}
.pill{display:inline-block;font:800 10px system-ui;padding:2px 6px;border-radius:8px;background:rgba(120,160,255,.18);color:#c6d4f2;margin-left:4px;vertical-align:middle}
.pill.g{background:#12a65a;color:#04140b}.pill.y{background:#ffd84d;color:#1a1200}.pill.r{background:#ff3b5c;color:#fff}
.skill{display:inline-block;width:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);vertical-align:middle;overflow:hidden}.skill i{display:block;height:100%;background:#22e07a}
.sel{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid rgba(120,160,255,.1);font-size:13px}
.sel .nm{flex:1}.sel .nm small{display:block;color:#9fb2d8;font-size:11px}
.sel input{width:20px;height:20px;accent-color:#22e07a}
.sel button{appearance:none;border:0;background:rgba(120,160,255,.15);color:#e8f0ff;border-radius:6px;width:28px;height:26px;font-weight:900}
.tabbar{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}.tabbar button{appearance:none;border:1px solid rgba(120,160,255,.25);background:transparent;color:#9fb2d8;font:700 12px system-ui;padding:6px 10px;border-radius:9px}
.tabbar button.on{background:#22e07a;color:#04140b;border-color:#22e07a}
/* panel over the pitch (between overs) */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;background:rgba(6,11,24,.96);border-top:1px solid rgba(34,224,122,.4);border-radius:16px 16px 0 0;padding:12px 14px 18px;max-height:72vh;overflow-y:auto;touch-action:pan-y;box-shadow:0 -10px 30px rgba(0,0,0,.6)}
#panel.on{display:block}#panel .btn{margin:5px 0;padding:11px 12px}
#pause{position:fixed;inset:0;z-index:30;background:rgba(3,6,14,.8);display:none;overflow-y:auto;touch-action:pan-y}#pause.on{display:block}
#pause .scr{background:rgba(8,14,28,.97);border:1px solid rgba(120,160,255,.25);border-radius:16px;margin:30px auto;max-width:520px}
.seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{appearance:none;border:1px solid rgba(120,160,255,.3);background:transparent;color:#c6d4f2;font:700 12px system-ui;padding:7px 10px;border-radius:9px}.seg button.on{background:#22e07a;color:#04140b;border-color:#22e07a}
.tips p{font-size:13px;line-height:1.5;color:#c6d4f2;margin:6px 0}
textarea.save{width:100%;box-sizing:border-box;height:90px;background:#050912;color:#9fb2d8;border:1px solid rgba(120,160,255,.3);border-radius:8px;font:11px monospace;padding:6px}
#proto{position:absolute;top:62px;right:10px;font:600 10px system-ui;color:#6f84ad;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="tabs"><button data-m="bat" class="on">BAT</button><button data-m="bowl">BOWL</button><button data-m="learn">LEARN</button></div>
  <div id="coach"><div class="ch"><span id="coT"></span><span id="coD"></span></div><div id="coX"></div><div id="coF"></div><div id="coPick"><button data-k="bat">🏏 Batting</button><button data-k="bowl">🎯 Bowling</button><button data-k="field">🧤 Fielding</button></div><button id="coBack">‹ Choose another tutorial</button></div>
  <div id="bug"><div class="tm" id="bugT">YOU</div><div class="sc" id="bugS">0/0</div><div class="ov" id="bugO">0.0 ov</div></div>
  <div id="over"></div>
  <div id="banner"></div>
  <div id="timing"></div>
  <button id="risk">⚠ RISK ANOTHER RUN</button>
  <div id="gun"><small>SPEED GUN</small><span id="gunV"></span></div>
  <div id="chips"><button id="chipA"></button><button id="chipB" class="info"></button><button id="chipC"></button></div>
  <div id="hint"></div>
  <div id="tick">Welcome!</div>
  <div id="minfo"></div>
  <div id="press"><span id="pressL">Pressure</span><div class="bar"><div id="pressF"></div></div></div>
  <div id="overCard"></div>
  <button id="pauseBtn" aria-label="Pause">II</button>
</div>
<div id="panel"></div>
<div id="pause"></div>
<div id="screen"></div>
<script src="engine.js"></script>
<script src="data.js"></script>
<script src="career.js"></script>

</body>
</html>
